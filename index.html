<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 教师学员管理系统</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #4f46e5;
  --primary-light: #e0e7ff;
  --danger: #ef4444;
  --danger-light: #fee2e2;
  --success: #10b981;
  --success-light: #d1fae5;
  --warning: #f59e0b;
  --warning-light: #fef3c7;
  --bg: #f1f5f9;
  --surface: #fff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-muted: #64748b;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.04);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* ===== Layout ===== */
.app-header {
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  color: #fff;
  padding: 16px 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 4px 20px rgba(79,70,229,.25);
}
.app-header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; }
.header-actions { display: flex; gap: 8px; }

.container { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }

/* ===== Stats Row ===== */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 14px;
}
.stat-icon {
  width: 44px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
}
.stat-icon.blue { background: var(--primary-light); }
.stat-icon.green { background: var(--success-light); }
.stat-icon.orange { background: var(--warning-light); }
.stat-icon.red { background: var(--danger-light); }
.stat-value { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
.stat-label { font-size: .8rem; color: var(--text-muted); }

/* ===== Toolbar ===== */
.toolbar {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  margin-bottom: 20px;
}
.search-box {
  flex: 1; min-width: 200px; position: relative;
}
.search-box input {
  width: 100%; padding: 10px 14px 10px 38px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: .9rem; outline: none; transition: border-color .2s;
}
.search-box input:focus { border-color: var(--primary); }
.search-box .search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); pointer-events: none;
}
.filter-select {
  padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px;
  font-size: .9rem; outline: none; background: var(--surface); cursor: pointer;
  min-width: 140px;
}
.filter-select:focus { border-color: var(--primary); }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px; border: none; border-radius: 8px;
  font-size: .9rem; font-weight: 600; cursor: pointer;
  transition: all .2s; white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #4338ca; box-shadow: 0 2px 8px rgba(79,70,229,.3); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #059669; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-outline {
  background: var(--surface); color: var(--text);
  border: 1.5px solid var(--border);
}
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 6px 12px; font-size: .8rem; border-radius: 6px; }
.btn-xs { padding: 3px 8px; font-size: .75rem; border-radius: 4px; }

/* ===== Table ===== */
.table-wrapper {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-muted);
}
.empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
table {
  width: 100%; border-collapse: collapse;
}
thead th {
  background: #f8fafc; padding: 12px 16px; text-align: left;
  font-size: .8rem; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .03em;
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
tbody td {
  padding: 14px 16px; border-bottom: 1px solid #f1f5f9;
  font-size: .9rem;
}
tbody tr { transition: background .15s; }
tbody tr:hover { background: #f8fafc; }
tbody tr:last-child td { border-bottom: none; }

.badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: .78rem; font-weight: 600;
}
.badge-blue { background: var(--primary-light); color: var(--primary); }
.badge-green { background: var(--success-light); color: #059669; }
.badge-orange { background: var(--warning-light); color: #b45309; }

.hours-low { color: var(--danger); font-weight: 600; }
.hours-ok { color: var(--text); }

.action-btns { display: flex; gap: 6px; flex-wrap: wrap; }

/* ===== Modal ===== */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 200;
  align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius);
  width: 90%; max-width: 520px; max-height: 85vh;
  overflow-y: auto; box-shadow: var(--shadow-lg);
}
.modal-header {
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--surface);
  border-radius: var(--radius) var(--radius) 0 0;
}
.modal-header h2 { font-size: 1.15rem; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px; border-radius: 8px; border: none;
  background: var(--bg); cursor: pointer; font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); transition: all .2s;
}
.modal-close:hover { background: var(--danger-light); color: var(--danger); }
.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px; border-top: 1px solid var(--border);
  display: flex; gap: 10px; justify-content: flex-end;
}

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: .85rem; font-weight: 600;
  margin-bottom: 6px; color: var(--text);
}
.form-group input, .form-group select {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
  border-radius: 8px; font-size: .9rem; outline: none; transition: border-color .2s;
}
.form-group input:focus, .form-group select:focus { border-color: var(--primary); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* ===== Sign-in Modal ===== */
.signin-student-info {
  background: #f8fafc; border-radius: 8px; padding: 16px;
  margin-bottom: 20px; text-align: center;
}
.signin-student-info .name { font-size: 1.2rem; font-weight: 700; }
.signin-student-info .meta { font-size: .85rem; color: var(--text-muted); margin-top: 4px; }
.signin-hint {
  background: var(--warning-light); border-radius: 8px;
  padding: 12px 16px; font-size: .85rem; color: #92400e;
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}

/* ===== History Tab ===== */
.tabs { display: flex; gap: 2px; margin-bottom: 20px; background: var(--surface); border-radius: 8px; padding: 4px; box-shadow: var(--shadow); }
.tab-btn {
  flex: 1; padding: 10px 20px; border: none; background: transparent;
  border-radius: 6px; font-size: .9rem; font-weight: 600; cursor: pointer;
  color: var(--text-muted); transition: all .2s;
}
.tab-btn.active { background: var(--primary); color: #fff; box-shadow: var(--shadow); }
.history-table td { vertical-align: middle; }

/* ===== History Student Cards ===== */
.history-student-card {
  background: var(--surface); border-radius: 8px;
  border: 1px solid var(--border); margin-bottom: 12px;
  overflow: hidden;
}
.history-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; cursor: pointer; user-select: none;
  transition: background .15s;
}
.history-card-header:hover { background: #f8fafc; }
.history-card-info {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.history-card-info strong { font-size: 1rem; }
.history-card-meta {
  display: flex; align-items: center; gap: 8px;
  font-size: .85rem; color: var(--text-muted); white-space: nowrap;
}
.collapse-arrow { font-size: .7rem; transition: transform .2s; }
.history-student-card.open .collapse-arrow { transform: rotate(180deg); }
.history-card-body {
  display: none; border-top: 1px solid var(--border);
  padding: 0;
}
.history-student-card.open .history-card-body { display: block; }
.history-card-body table { margin: 0; }
.history-card-body thead th { background: #fafafa; font-size: .75rem; }
.history-card-body tbody td { font-size: .85rem; padding: 10px 16px; }

/* ===== Toast ===== */
.toast-container {
  position: fixed; top: 80px; right: 24px; z-index: 999;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 12px 20px; border-radius: 8px; color: #fff; font-weight: 600;
  font-size: .9rem; box-shadow: var(--shadow-lg);
  animation: slideIn .3s ease;
  display: flex; align-items: center; gap: 8px;
}
.toast-success { background: #059669; }
.toast-error { background: #dc2626; }
.toast-info { background: #4f46e5; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .container { padding: 12px; }
  .toolbar { flex-direction: column; }
  .search-box { min-width: 100%; }
  .filter-select { width: 100%; }
  .btn { width: 100%; justify-content: center; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .form-row { grid-template-columns: 1fr; }
  table { font-size: .8rem; }
  thead th, tbody td { padding: 10px 8px; }
  .action-btns { flex-direction: column; }
  .btn-sm { width: 100%; justify-content: center; }
}
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header class="app-header">
  <h1>📚 教师学员管理系统</h1>
  <div class="header-actions">
    <button class="btn btn-outline" onclick="exportData()" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)">📥 导出</button>
    <button class="btn btn-outline" onclick="document.getElementById('importFile').click()" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)">📤 导入</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn btn-success" onclick="openAddStudentModal()">＋ 添加学员</button>
  </div>
</header>

<div class="container">
  <!-- ===== Stats ===== -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon blue">👥</div>
      <div><div class="stat-value" id="statTotal">0</div><div class="stat-label">学员总数</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon red">📌</div>
      <div><div class="stat-value" id="statClasses">0</div><div class="stat-label">班级数量</div></div>
    </div>
  </div>

  <!-- ===== Tabs ===== -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('students')">🎓 学员管理</button>
    <button class="tab-btn" onclick="switchTab('history')">📋 签到记录</button>
  </div>

  <!-- ===== Toolbar (Students Tab) ===== -->
  <div class="toolbar" id="toolbarStudents">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索姓名、电话、课程…" oninput="renderStudents()">
    </div>
    <select class="filter-select" id="filterClass" onchange="renderStudents()">
      <option value="">📂 全部班级</option>
    </select>
    <select class="filter-select" id="filterCourse" onchange="renderStudents()">
      <option value="">📖 全部课程类别</option>
    </select>
    <button class="btn btn-success" onclick="openBatchSigninModal()">🚀 一键签到</button>
  </div>

  <!-- ===== Toolbar (History Tab) ===== -->
  <div class="toolbar" id="toolbarHistory" style="display: none;">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchHistory" placeholder="搜索学员姓名…" oninput="renderHistory()">
    </div>
    <select class="filter-select" id="filterHistoryClass" onchange="renderHistory()">
      <option value="">📂 全部班级</option>
    </select>
    <button class="btn btn-danger btn-sm" onclick="clearHistory()">🗑️ 清空记录</button>
  </div>

  <!-- ===== Student Table ===== -->
  <div class="table-wrapper" id="studentsTableWrapper">
    <div class="empty-state">
      <div class="empty-icon">📭</div>
      <p>还没有添加学员</p>
      <button class="btn btn-primary" style="margin-top:12px" onclick="openAddStudentModal()">＋ 添加第一个学员</button>
    </div>
  </div>

  <!-- ===== History Table ===== -->
  <div class="table-wrapper" id="historyTableWrapper" style="display: none;">
    <div class="empty-state">
      <div class="empty-icon">📋</div>
      <p>暂无签到记录</p>
    </div>
  </div>
</div>

<!-- ===== Student Form Modal ===== -->
<div class="modal-overlay" id="studentModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="studentModalTitle">添加学员</h2>
      <button class="modal-close" onclick="closeModal('studentModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editStudentId">
      <div class="form-row">
        <div class="form-group">
          <label>👤 姓名 *</label>
          <input type="text" id="studentName" placeholder="请输入学员姓名" autocomplete="off">
        </div>
        <div class="form-group">
          <label>📞 电话</label>
          <input type="text" id="studentPhone" placeholder="请输入联系电话" autocomplete="off">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>📚 课程类别 *</label>
          <select id="studentCourse">
            <option value="">请选择课程类别</option>
            <option value="常规课">常规课</option>
            <option value="集训课">集训课</option>
          </select>
        </div>
        <div class="form-group">
          <label>🏫 班级 *</label>
          <input type="text" id="studentClass" list="classDatalist" placeholder="输入班级名称，如：周六上午班" autocomplete="off">
          <datalist id="classDatalist"></datalist>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>⏰ 总课时（剩余） *</label>
          <input type="number" id="studentHours" placeholder="请输入课时数" min="0" value="0">
        </div>
        <div class="form-group">
          <label>📝 备注</label>
          <input type="text" id="studentNote" placeholder="如：需补材料、过敏提醒…" autocomplete="off">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('studentModal')">取消</button>
      <button class="btn btn-primary" onclick="saveStudent()">💾 保存</button>
    </div>
  </div>
</div>

<!-- ===== Sign-in (销课) Modal ===== -->
<div class="modal-overlay" id="signinModal">
  <div class="modal">
    <div class="modal-header">
      <h2>✍️ 签到销课</h2>
      <button class="modal-close" onclick="closeModal('signinModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="signin-student-info">
        <div class="name" id="signinStudentName">—</div>
        <div class="meta">
          剩余课时：<strong id="signinRemainHours">0</strong> &nbsp;|&nbsp;
          班级：<span id="signinStudentClass">—</span>
        </div>
      </div>
      <div class="signin-hint">
        ⚠️ 签到后将自动扣除 1 个课时
      </div>
      <div class="form-group">
        <label>📝 备注（可选）</label>
        <input type="text" id="signinNote" placeholder="例如：第3节课，表现优秀" autocomplete="off">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('signinModal')">取消</button>
      <button class="btn btn-success" onclick="confirmSignin()">✅ 确认签到（-1课时）</button>
    </div>
  </div>
</div>

<!-- ===== Batch Sign-in Modal ===== -->
<div class="modal-overlay" id="batchSigninModal">
  <div class="modal" style="max-width: 600px;">
    <div class="modal-header">
      <h2>🚀 一键签到（按班级）</h2>
      <button class="modal-close" onclick="closeModal('batchSigninModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>🏫 选择班级</label>
          <select id="batchClassSelect" onchange="renderBatchStudentList()">
            <option value="">请选择班级</option>
          </select>
        </div>
        <div class="form-group">
          <label>📚 课程类别</label>
          <select id="batchCourseSelect" onchange="renderBatchStudentList()">
            <option value="">全部课程</option>
            <option value="常规课">常规课</option>
            <option value="集训课">集训课</option>
          </select>
        </div>
      </div>
      <div class="signin-hint">
        💡 默认全员签到，取消勾选 = 请假（不扣课时）。课时为 0 的学员自动跳过。
      </div>
      <div id="batchStudentList" style="max-height: 300px; overflow-y: auto;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('batchSigninModal')">取消</button>
      <button class="btn btn-success" onclick="confirmBatchSignin()">✅ 确认签到</button>
    </div>
  </div>
</div>

<!-- ===== Toast Container ===== -->

function saveData(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

// Load data: localStorage first, fall back to embedded data in file
let students = loadData(STORAGE_KEYS.students, null);
let history = loadData(STORAGE_KEYS.history, null);

// If localStorage has no data, seed from embedded data block
if ((!students || students.length === 0) || (!history || history.length === 0)) {
  const el = document.getElementById('embedded-data');
  if (el && el.textContent.trim()) {
    try {
      const data = JSON.parse(el.textContent);
      if (data.students && data.students.length > 0) {
        students = data.students;
        history = data.history || [];
        persistStudents();
        persistHistory();
      }
    } catch (e) {}
  }
}
// Final fallback
if (!students) students = [];
if (!history) history = [];

// Courses are fixed — no longer persisted
let courseList = DEFAULT_COURSES;

// Classes are derived dynamically from students — no longer stored separately
function getClassList() {
  const classes = new Set(students.map(s => s.className).filter(Boolean));
  return [...classes].sort();
}

// Persist helpers
function persistStudents() { saveData(STORAGE_KEYS.students, students); }
function persistHistory() { saveData(STORAGE_KEYS.history, history); }

// ==================== Toast ====================
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  toast.innerHTML = `${icons[type] || ''} ${msg}`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity .3s'; setTimeout(() => toast.remove(), 300); }, 2500);
}

// ==================== Modal helpers ====================
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

// ==================== Tab Switch ====================
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (tab === 'students') {
    document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
    document.getElementById('toolbarStudents').style.display = 'flex';
    document.getElementById('toolbarHistory').style.display = 'none';
    document.getElementById('studentsTableWrapper').style.display = '';
    document.getElementById('historyTableWrapper').style.display = 'none';
  } else {
    document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
    document.getElementById('toolbarStudents').style.display = 'none';
    document.getElementById('toolbarHistory').style.display = 'flex';
    document.getElementById('studentsTableWrapper').style.display = 'none';
    document.getElementById('historyTableWrapper').style.display = '';
    renderHistory();
  }
}

// ==================== Populate Dropdowns ====================
function populateFilters() {
  const classes = getClassList();

  // Class filter for students
  const filterClass = document.getElementById('filterClass');
  filterClass.innerHTML = '<option value="">📂 全部班级</option>' + classes.map(c => `<option value="${c}">${c}</option>`).join('');

  // Course filter
  const filterCourse = document.getElementById('filterCourse');
  filterCourse.innerHTML = '<option value="">📖 全部课程类别</option>' + courseList.map(c => `<option value="${c}">${c}</option>`).join('');

  // History class filter
  const filterHistoryClass = document.getElementById('filterHistoryClass');
  filterHistoryClass.innerHTML = '<option value="">📂 全部班级</option>' + classes.map(c => `<option value="${c}">${c}</option>`).join('');

  // Class datalist for autocomplete
  const datalist = document.getElementById('classDatalist');
  datalist.innerHTML = classes.map(c => `<option value="${c}">`).join('');

  // Form course select
  const studentCourse = document.getElementById('studentCourse');
  studentCourse.innerHTML = '<option value="">请选择课程类别</option>' + courseList.map(c => `<option value="${c}">${c}</option>`).join('');
}

// ==================== Render Student Table ====================
function renderStudents() {
  const wrapper = document.getElementById('studentsTableWrapper');
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const filterClass = document.getElementById('filterClass').value;
  const filterCourse = document.getElementById('filterCourse').value;

  let filtered = students.filter(s => {
    const matchSearch = !search || s.name.toLowerCase().includes(search) || s.phone.includes(search) || s.course.toLowerCase().includes(search) || s.className.toLowerCase().includes(search);
    const matchClass = !filterClass || s.className === filterClass;
    const matchCourse = !filterCourse || s.course === filterCourse;
    return matchSearch && matchClass && matchCourse;
  });

  if (filtered.length === 0) {
    wrapper.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><p>${students.length === 0 ? '还没有添加学员' : '没有匹配的学员'}</p>${students.length === 0 ? '<button class="btn btn-primary" style="margin-top:12px" onclick="openAddStudentModal()">＋ 添加第一个学员</button>' : ''}</div>`;
  } else {
    wrapper.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>姓名</th><th>电话</th><th>课程</th><th>班级</th>
            <th>课时</th><th>创建时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(s => {
            const hoursClass = s.hours <= 2 ? 'hours-low' : 'hours-ok';
            return `
              <tr>
                <td>
                <strong>${escHtml(s.name)}</strong>
                ${s.note ? `<div style="font-size:.78rem;color:var(--text-muted);margin-top:2px">${escHtml(s.note)}</div>` : ''}
              </td>
                <td>${escHtml(s.phone) || '—'}</td>
                <td><span class="badge badge-blue">${escHtml(s.course)}</span></td>
                <td><span class="badge badge-green">${escHtml(s.className)}</span></td>
                <td class="${hoursClass}"><strong>${s.hours}</strong> 课时</td>
                <td>${formatDateTime(s.createdAt)}</td>
                <td>
                  <div class="action-btns">
                    <button class="btn btn-success btn-sm" onclick="openSigninModal('${s.id}')" ${s.hours <= 0 ? 'disabled' : ''}>✍️ 签到</button>
                    <button class="btn btn-outline btn-sm" onclick="openEditStudentModal('${s.id}')">✏️ 编辑</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.id}')">🗑️ 删除</button>
                  </div>
                </td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  updateStats();
}

// ==================== Render History Table ====================
function renderHistory() {
  const wrapper = document.getElementById('historyTableWrapper');
  const search = document.getElementById('searchHistory').value.toLowerCase().trim();
  const filterClass = document.getElementById('filterHistoryClass').value;

  // Group by studentId
  const grouped = {};
  history.forEach(h => {
    if (!grouped[h.studentId]) {
      grouped[h.studentId] = {
        studentId: h.studentId,
        studentName: h.studentName,
        className: h.className,
        course: h.course,
        records: [],
      };
    }
    grouped[h.studentId].records.push(h);
  });

  // Filter
  let groups = Object.values(grouped);
  if (search) {
    groups = groups.filter(g => g.studentName.toLowerCase().includes(search));
  }
  if (filterClass) {
    groups = groups.filter(g => g.className === filterClass);
  }

  // Sort groups: most recently active first
  groups.sort((a, b) => {
    const aMax = Math.max(...a.records.map(r => new Date(r.time).getTime()));
    const bMax = Math.max(...b.records.map(r => new Date(r.time).getTime()));
    return bMax - aMax;
  });

  // Sort records within each group: newest first
  groups.forEach(g => g.records.sort((a, b) => new Date(b.time) - new Date(a.time)));

  if (groups.length === 0) {
    wrapper.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>暂无签到记录</p></div>';
  } else {
    wrapper.innerHTML = groups.map(g => `
      <div class="history-student-card open">
        <div class="history-card-header" onclick="toggleHistoryCard(this)">
          <div class="history-card-info">
            <strong>${escHtml(g.studentName)}</strong>
            <span class="badge badge-green">${escHtml(g.className)}</span>
            <span class="badge badge-blue">${escHtml(g.course)}</span>
          </div>
          <div class="history-card-meta">
            <span>共 ${g.records.length} 次签到</span>
            <span class="collapse-arrow">▼</span>
          </div>
        </div>
        <div class="history-card-body">
          <table>
            <thead><tr><th>签到时间</th><th>剩余课时</th><th>备注</th></tr></thead>
            <tbody>
              ${g.records.map(r => `
                <tr>
                  <td>${formatDateTime(r.time)}</td>
                  <td>${r.remainHours} 课时</td>
                  <td>${escHtml(r.note) || '—'}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `).join('');
  }
}

function toggleHistoryCard(header) {
  header.parentElement.classList.toggle('open');
}

// ==================== Stats ====================
function updateStats() {
  document.getElementById('statTotal').textContent = students.length;
  const classes = new Set(students.map(s => s.className).filter(Boolean));
  document.getElementById('statClasses').textContent = classes.size;
}

// ==================== Student CRUD ====================
function openAddStudentModal() {
  document.getElementById('studentModalTitle').textContent = '添加学员';
  document.getElementById('editStudentId').value = '';
  document.getElementById('studentName').value = '';
  document.getElementById('studentPhone').value = '';
  document.getElementById('studentCourse').value = '';
  document.getElementById('studentClass').value = '';
  document.getElementById('studentHours').value = '0';
  document.getElementById('studentNote').value = '';
  populateFilters();
  openModal('studentModal');
}

function openEditStudentModal(id) {
  const s = students.find(st => st.id === id);
  if (!s) return;
  document.getElementById('studentModalTitle').textContent = '编辑学员';
  document.getElementById('editStudentId').value = s.id;
  document.getElementById('studentName').value = s.name;
  document.getElementById('studentPhone').value = s.phone || '';
  document.getElementById('studentCourse').value = s.course;
  document.getElementById('studentClass').value = s.className;
  document.getElementById('studentHours').value = s.hours;
  document.getElementById('studentNote').value = s.note || '';
  populateFilters();
  openModal('studentModal');
}

function saveStudent() {
  const editId = document.getElementById('editStudentId').value;
  const name = document.getElementById('studentName').value.trim();
  const phone = document.getElementById('studentPhone').value.trim();
  const course = document.getElementById('studentCourse').value;
  const className = document.getElementById('studentClass').value;
  const hours = parseInt(document.getElementById('studentHours').value) || 0;
  const note = document.getElementById('studentNote').value.trim();

  if (!name) { showToast('请输入学员姓名', 'error'); return; }
  if (!course) { showToast('请选择课程类别', 'error'); return; }
  if (!className) { showToast('请输入班级名称', 'error'); return; }

  if (editId) {
    const idx = students.findIndex(s => s.id === editId);
    if (idx !== -1) {
      students[idx].name = name;
      students[idx].phone = phone;
      students[idx].course = course;
      students[idx].className = className;
      students[idx].hours = hours;
      students[idx].note = note;
      showToast('学员信息已更新 ✅', 'success');
    }
  } else {
    const newStudent = {
      id: generateId(),
      name,
      phone,
      course,
      className,
      hours,
      note,
      createdAt: new Date().toISOString(),
    };
    students.push(newStudent);
    showToast('学员添加成功 🎉', 'success');
  }

  persistStudents();
  closeModal('studentModal');
  renderStudents();
  populateFilters();
}

function deleteStudent(id) {
  const s = students.find(st => st.id === id);
  if (!s) return;
  if (!confirm(`确定要删除学员「${s.name}」吗？\n此操作不可恢复！`)) return;

  students = students.filter(st => st.id !== id);
  persistStudents();
  renderStudents();
  renderHistory();
  populateFilters();
  showToast(`已删除学员「${s.name}」`, 'info');
}

// ==================== Sign-in ====================
let signinTargetId = null;

function openSigninModal(id) {
  const s = students.find(st => st.id === id);
  if (!s) return;
  if (s.hours <= 0) { showToast('该学员课时已用完，无法签到', 'error'); return; }

  signinTargetId = id;
  document.getElementById('signinStudentName').textContent = s.name;
  document.getElementById('signinRemainHours').textContent = s.hours;
  document.getElementById('signinStudentClass').textContent = s.className;
  document.getElementById('signinNote').value = '';
  openModal('signinModal');
}

function confirmSignin() {
  if (!signinTargetId) return;
  const s = students.find(st => st.id === signinTargetId);
  if (!s) return;
  if (s.hours <= 0) { showToast('课时不足，无法签到', 'error'); return; }

  s.hours -= 1;
  const note = document.getElementById('signinNote').value.trim();
  const record = {
    id: generateId(),
    studentId: s.id,
    studentName: s.name,
    className: s.className,
    course: s.course,
    time: new Date().toISOString(),
    remainHours: s.hours,
    note,
  };
  history.push(record);

  persistStudents();
  persistHistory();
  closeModal('signinModal');
  signinTargetId = null;
  renderStudents();
  renderHistory();
  showToast(`签到成功！「${s.name}」剩余 ${s.hours} 课时 ✍️`, 'success');
}

// ==================== Batch Sign-in ====================
function openBatchSigninModal() {
  // Populate class dropdown
  const select = document.getElementById('batchClassSelect');
  const classes = getClassList();
  select.innerHTML = '<option value="">请选择班级</option>' + classes.map(c => `<option value="${c}">${c}</option>`).join('');
  document.getElementById('batchStudentList').innerHTML = '';
  openModal('batchSigninModal');
}

function renderBatchStudentList() {
  const className = document.getElementById('batchClassSelect').value;
  const courseFilter = document.getElementById('batchCourseSelect').value;
  const container = document.getElementById('batchStudentList');

  if (!className) {
    container.innerHTML = '';
    return;
  }

  let classStudents = students.filter(s => s.className === className);
  if (courseFilter) {
    classStudents = classStudents.filter(s => s.course === courseFilter);
  }

  if (classStudents.length === 0) {
    container.innerHTML = '<div class="empty-state" style="padding:30px"><p>该班级暂无学员</p></div>';
    return;
  }

  container.innerHTML = `
    <table>
      <thead>
        <tr><th style="width:40px">签到</th><th>姓名</th><th>课程</th><th>剩余课时</th><th>状态</th></tr>
      </thead>
      <tbody>
        ${classStudents.map(s => {
          const noHours = s.hours <= 0;
          return `
            <tr>
              <td>
                <input type="checkbox" class="batch-check" value="${s.id}" ${noHours ? 'disabled' : 'checked'} style="width:18px;height:18px;cursor:pointer">
              </td>
              <td><strong>${escHtml(s.name)}</strong></td>
              <td><span class="badge badge-blue">${escHtml(s.course)}</span></td>
              <td class="${s.hours <= 2 ? 'hours-low' : 'hours-ok'}"><strong>${s.hours}</strong></td>
              <td>${noHours ? '<span class="badge badge-orange">😴 课时不足</span>' : '<span class="badge badge-green">✅ 可签到</span>'}</td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline btn-sm" onclick="document.querySelectorAll('.batch-check:not([disabled])').forEach(c=>c.checked=true)">全选</button>
      <button class="btn btn-outline btn-sm" onclick="document.querySelectorAll('.batch-check:not([disabled])').forEach(c=>c.checked=false)">取消全选</button>
    </div>`;
}

function confirmBatchSignin() {
  const className = document.getElementById('batchClassSelect').value;
  if (!className) { showToast('请选择班级', 'error'); return; }

  const checkboxes = document.querySelectorAll('.batch-check:checked');
  if (checkboxes.length === 0) { showToast('没有可签到的学员', 'error'); return; }

  let signedCount = 0;
  let absentCount = 0;

  checkboxes.forEach(cb => {
    const s = students.find(st => st.id === cb.value);
    if (!s || s.hours <= 0) return;

    s.hours -= 1;
    signedCount++;

    history.push({
      id: generateId(),
      studentId: s.id,
      studentName: s.name,
      className: s.className,
      course: s.course,
      time: new Date().toISOString(),
      remainHours: s.hours,
      note: '',
    });
  });

  // Count absent students (unchecked, who had hours)
  const allChecks = document.querySelectorAll('.batch-check:not([disabled])');
  absentCount = allChecks.length - checkboxes.length;

  persistStudents();
  persistHistory();
  closeModal('batchSigninModal');
  renderStudents();
  renderHistory();

  let msg = `批量签到完成！签到 ${signedCount} 人`;
  if (absentCount > 0) msg += `，请假 ${absentCount} 人`;
  showToast(msg, 'success');
}

// ==================== History ====================
function clearHistory() {
  if (!confirm('确定要清空所有签到记录吗？此操作不可恢复！')) return;
  history = [];
  persistHistory();
  renderHistory();
  showToast('签到记录已清空', 'info');
}

// ==================== Utilities ====================
function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDateTime(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== Export / Import ====================
function exportData() {
  const data = { students, history, exportedAt: new Date().toISOString() };
  const json = JSON.stringify(data);

  let html = document.documentElement.outerHTML;
  // Replace the embedded-data script content with new data
  html = html.replace(
    /(<script type="application\/json" id="embedded-data">)[\s\S]*?(<\/script>)/,
    '$1' + json + '$2'
  );

  const blob = new Blob(['<!DOCTYPE html>\n', html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `学员管理系统_${new Date().toISOString().slice(0, 10)}.html`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出为完整文件，打开即用 ✅', 'success');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.students || !Array.isArray(data.students)) {
        throw new Error('数据格式不正确');
      }

      const action = confirm(
        `即将导入：\n• ${data.students.length} 名学员\n• ${(data.history || []).length} 条签到记录\n\n点击"确定"覆盖当前数据\n点击"取消"放弃导入`
      );

      if (!action) return;

      students = data.students;
      history = data.history || [];
      persistStudents();
      persistHistory();
      populateFilters();
      renderStudents();
      renderHistory();
      updateStats();
      showToast(`导入成功！${students.length} 名学员已恢复 🎉`, 'success');
    } catch (err) {
      showToast('导入失败：文件格式不正确 ❌', 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ==================== Init ====================
function init() {
  populateFilters();
  renderStudents();
  updateStats();
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
  });
});

// Keyboard shortcut: Escape to close all modals
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active').forEach(o => o.classList.remove('active'));
  }
});

init();
