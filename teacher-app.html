<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 教师学员管理系统</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #4f46e5;
  --primary-light: #e0e7ff;
  --danger: #ef4444;
  --danger-light: #fee2e2;
  --success: #10b981;
  --success-light: #d1fae5;
  --warning: #f59e0b;
  --warning-light: #fef3c7;
  --bg: #f1f5f9;
  --surface: #fff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-muted: #64748b;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.04);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* ===== Layout ===== */
.app-header {
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  color: #fff;
  padding: 16px 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 4px 20px rgba(79,70,229,.25);
}
.app-header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; }
.header-actions { display: flex; gap: 8px; }

.container { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }

/* ===== Stats Row ===== */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 14px;
}
.stat-icon {
  width: 44px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
}
.stat-icon.blue { background: var(--primary-light); }
.stat-icon.green { background: var(--success-light); }
.stat-icon.orange { background: var(--warning-light); }
.stat-icon.red { background: var(--danger-light); }
.stat-value { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
.stat-label { font-size: .8rem; color: var(--text-muted); }

/* ===== Toolbar ===== */
.toolbar {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  margin-bottom: 20px;
}
.search-box {
  flex: 1; min-width: 200px; position: relative;
}
.search-box input {
  width: 100%; padding: 10px 14px 10px 38px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: .9rem; outline: none; transition: border-color .2s;
}
.search-box input:focus { border-color: var(--primary); }
.search-box .search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); pointer-events: none;
}
.filter-select {
  padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px;
  font-size: .9rem; outline: none; background: var(--surface); cursor: pointer;
  min-width: 140px;
}
.filter-select:focus { border-color: var(--primary); }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px; border: none; border-radius: 8px;
  font-size: .9rem; font-weight: 600; cursor: pointer;
  transition: all .2s; white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #4338ca; box-shadow: 0 2px 8px rgba(79,70,229,.3); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #059669; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-warning { background: var(--warning); color: #fff; }
.btn-warning:hover { background: #d97706; }
.btn-outline {
  background: var(--surface); color: var(--text);
  border: 1.5px solid var(--border);
}
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 6px 12px; font-size: .8rem; border-radius: 6px; }
.btn-xs { padding: 3px 8px; font-size: .75rem; border-radius: 4px; }

/* ===== Table ===== */
.table-wrapper {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-muted);
}
.empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
table {
  width: 100%; border-collapse: collapse;
}
thead th {
  background: #f8fafc; padding: 12px 16px; text-align: left;
  font-size: .8rem; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .03em;
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
tbody td {
  padding: 14px 16px; border-bottom: 1px solid #f1f5f9;
  font-size: .9rem;
}
tbody tr { transition: background .15s; }
tbody tr:hover { background: #f8fafc; }
tbody tr:last-child td { border-bottom: none; }

.badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: .78rem; font-weight: 600;
}
.badge-blue { background: var(--primary-light); color: var(--primary); }
.badge-green { background: var(--success-light); color: #059669; }
.badge-orange { background: var(--warning-light); color: #b45309; }

.hours-low { color: var(--danger); font-weight: 600; }
.hours-ok { color: var(--text); }

.action-btns { display: flex; gap: 6px; flex-wrap: wrap; }

/* ===== Modal ===== */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 200;
  align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius);
  width: 90%; max-width: 520px; max-height: 85vh;
  overflow-y: auto; box-shadow: var(--shadow-lg);
}
.modal-header {
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--surface);
  border-radius: var(--radius) var(--radius) 0 0;
}
.modal-header h2 { font-size: 1.15rem; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px; border-radius: 8px; border: none;
  background: var(--bg); cursor: pointer; font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); transition: all .2s;
}
.modal-close:hover { background: var(--danger-light); color: var(--danger); }
.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px; border-top: 1px solid var(--border);
  display: flex; gap: 10px; justify-content: flex-end;
}

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: .85rem; font-weight: 600;
  margin-bottom: 6px; color: var(--text);
}
.form-group input, .form-group select {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
  border-radius: 8px; font-size: .9rem; outline: none; transition: border-color .2s;
}
.form-group input:focus, .form-group select:focus { border-color: var(--primary); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* ===== Sign-in Modal ===== */
.signin-student-info {
  background: #f8fafc; border-radius: 8px; padding: 16px;
  margin-bottom: 20px; text-align: center;
}
.signin-student-info .name { font-size: 1.2rem; font-weight: 700; }
.signin-student-info .meta { font-size: .85rem; color: var(--text-muted); margin-top: 4px; }
.signin-hint {
  background: var(--warning-light); border-radius: 8px;
  padding: 12px 16px; font-size: .85rem; color: #92400e;
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}

/* ===== History Tab ===== */
.tabs { display: flex; gap: 2px; margin-bottom: 20px; background: var(--surface); border-radius: 8px; padding: 4px; box-shadow: var(--shadow); }
.tab-btn {
  flex: 1; padding: 10px 20px; border: none; background: transparent;
  border-radius: 6px; font-size: .9rem; font-weight: 600; cursor: pointer;
  color: var(--text-muted); transition: all .2s;
}
.tab-btn.active { background: var(--primary); color: #fff; box-shadow: var(--shadow); }
.history-sub-tab.active { background: var(--primary) !important; color: #fff !important; }
.history-sub-tab:not(.active) { background: var(--surface); color: var(--text-muted); }
.history-table td { vertical-align: middle; }

/* ===== History Student Cards ===== */
.history-student-card {
  background: var(--surface); border-radius: 8px;
  border: 1px solid var(--border); margin-bottom: 12px;
  overflow: hidden;
}
.history-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; cursor: pointer; user-select: none;
  transition: background .15s;
}
.history-card-header:hover { background: #f8fafc; }
.history-card-info {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.history-card-info strong { font-size: 1rem; }
.history-card-meta {
  display: flex; align-items: center; gap: 8px;
  font-size: .85rem; color: var(--text-muted); white-space: nowrap;
}
.collapse-arrow { font-size: .7rem; transition: transform .2s; }
.history-student-card.open .collapse-arrow { transform: rotate(180deg); }
.arch-arrow.open { transform: rotate(180deg); }
.history-card-body {
  display: none; border-top: 1px solid var(--border);
  padding: 0;
}
.history-student-card.open .history-card-body { display: block; }
.history-card-body table { margin: 0; }
.history-card-body thead th { background: #fafafa; font-size: .75rem; }
.history-card-body tbody td { font-size: .85rem; padding: 10px 16px; }

/* ===== Toast ===== */
.toast-container {
  position: fixed; top: 80px; right: 24px; z-index: 999;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 12px 20px; border-radius: 8px; color: #fff; font-weight: 600;
  font-size: .9rem; box-shadow: var(--shadow-lg);
  animation: slideIn .3s ease;
  display: flex; align-items: center; gap: 8px;
}
.toast-success { background: #059669; }
.toast-error { background: #dc2626; }
.toast-info { background: #4f46e5; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .container { padding: 8px; }
  .app-header { padding: 10px 12px; }
  .app-header h1 { font-size: 1rem; }
  .header-actions { gap: 4px; flex-wrap: wrap; }
  .header-actions .btn { padding: 6px 10px; font-size: .75rem; gap: 3px; }
  .toolbar { flex-direction: column; }
  .search-box { min-width: 100%; }
  .filter-select { width: 100%; }
  .btn { width: 100%; justify-content: center; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .form-row { grid-template-columns: 1fr; }
  .stat-card { padding: 10px 14px; }
  .stat-value { font-size: 1.2rem; }
  .stat-label { font-size: .7rem; }
  .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { font-size: .75rem; white-space: nowrap; min-width: 650px; }
  thead th, tbody td { padding: 8px 6px; }
  .action-btns { flex-direction: row; flex-wrap: wrap; }
  .btn-sm { padding: 5px 8px; font-size: .72rem; width: auto; }
  .tabs .tab-btn { padding: 8px 12px; font-size: .8rem; }
  .modal { width: 95%; max-height: 90vh; }
  .modal-header { padding: 14px 16px; }
  .modal-body { padding: 16px; }
  .modal-footer { padding: 12px 16px; flex-wrap: wrap; }
  .signin-student-info { padding: 12px; }
  .signin-student-info .name { font-size: 1rem; }
  .toast-container { top: 60px; right: 8px; left: 8px; }
  .toast { font-size: .8rem; padding: 10px 14px; }
  .history-card-header { padding: 10px 12px; flex-direction: column; align-items: flex-start; gap: 6px; }
  .history-card-info { gap: 6px; }
  .history-card-info strong { font-size: .9rem; }
  .history-card-meta { font-size: .75rem; }
  .history-card-body thead th { font-size: .7rem; }
  .history-card-body tbody td { font-size: .75rem; padding: 8px 10px; }
}
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header class="app-header">
  <h1>📚 教师学员管理系统</h1>
  <div class="header-actions">
    <button class="btn btn-outline" onclick="exportData()" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)">📥 导出</button>
    <button class="btn btn-outline" onclick="document.getElementById('importFile').click()" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)">📤 导入</button>
    <button class="btn btn-outline" onclick="resetApp()" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)">🔄 重置</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn btn-success" onclick="openAddStudentModal()">＋ 添加学员</button>
  </div>
</header>

<div class="container">
  <!-- ===== Stats ===== -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon blue">👥</div>
      <div><div class="stat-value" id="statTotal">0</div><div class="stat-label">学员总数</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon red">📌</div>
      <div><div class="stat-value" id="statClasses">0</div><div class="stat-label">班级数量</div></div>
    </div>
  </div>

  <!-- ===== Tabs ===== -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('students')">🎓 学员管理</button>
    <button class="tab-btn" onclick="switchTab('history')">📋 签到记录</button>
    <button class="tab-btn" onclick="switchTab('archive')">📂 学员档案</button>
  </div>

  <!-- ===== Toolbar (Students Tab) ===== -->
  <div class="toolbar" id="toolbarStudents">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索姓名、电话、课程…" oninput="renderStudents()">
    </div>
    <select class="filter-select" id="filterClass" onchange="renderStudents()">
      <option value="">📂 全部班级</option>
    </select>
    <select class="filter-select" id="filterCourse" onchange="renderStudents()">
      <option value="">📖 全部课程类别</option>
    </select>
    <button class="btn btn-success" onclick="openBatchSigninModal()">🚀 一键签到</button>
  </div>

  <!-- ===== Toolbar (History Tab) ===== -->
  <div class="toolbar" id="toolbarHistory" style="display: none;">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchHistory" placeholder="搜索学员姓名…" oninput="renderHistory()">
    </div>
    <select class="filter-select" id="filterHistoryClass" onchange="renderHistory()">
      <option value="">📂 全部班级</option>
    </select>
    <button class="btn btn-warning btn-sm" onclick="openArchiveModal()">📦 一键结课</button>
    <button class="btn btn-danger btn-sm" onclick="clearHistory()">🗑️ 清空记录</button>
  </div>

  <!-- ===== Archive Filter Bar ===== -->
  <div id="historySubTabs" style="display:none;margin-bottom:12px;flex-wrap:wrap;gap:4px"></div>

  <!-- ===== Student Table ===== -->
  <div class="table-wrapper" id="studentsTableWrapper">
    <div class="empty-state">
      <div class="empty-icon">📭</div>
      <p>还没有添加学员</p>
      <button class="btn btn-primary" style="margin-top:12px" onclick="openAddStudentModal()">＋ 添加第一个学员</button>
    </div>
  </div>

  <!-- ===== History Table ===== -->
  <div class="table-wrapper" id="historyTableWrapper" style="display: none;">
    <div class="empty-state">
      <div class="empty-icon">📋</div>
      <p>暂无签到记录</p>
    </div>
  </div>

  <!-- ===== Archive Filter Bar ===== -->
  <div id="archiveSubTabs" style="display:none;margin-bottom:12px;flex-wrap:wrap;gap:4px"></div>

  <!-- ===== Archive Tab ===== -->
  <div class="table-wrapper" id="archiveTableWrapper" style="display: none;">
    <div class="empty-state">
      <div class="empty-icon">📂</div>
      <p>暂无学员档案</p>
    </div>
  </div>
</div>

<!-- ===== Student Form Modal ===== -->
<div class="modal-overlay" id="studentModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="studentModalTitle">添加学员</h2>
      <button class="modal-close" onclick="closeModal('studentModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editStudentId">
      <div class="form-row">
        <div class="form-group">
          <label>👤 姓名 *</label>
          <input type="text" id="studentName" placeholder="请输入学员姓名" autocomplete="off">
        </div>
        <div class="form-group">
          <label>📞 电话</label>
          <input type="text" id="studentPhone" placeholder="请输入联系电话" autocomplete="off">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>📖 常规课课时</label>
          <input type="number" id="studentNormalHours" placeholder="0 表示不报此课" min="0" value="0">
        </div>
        <div class="form-group">
          <label>🏆 集训课课时</label>
          <input type="number" id="studentTrainingHours" placeholder="0 表示不报此课" min="0" value="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>🏫 班级 *</label>
          <input type="text" id="studentClass" list="classDatalist" placeholder="输入班级名称，如：周六上午班" autocomplete="off">
          <datalist id="classDatalist"></datalist>
        </div>
        <div class="form-group">
          <label>📝 备注</label>
          <input type="text" id="studentNote" placeholder="如：需补材料、过敏提醒…" autocomplete="off">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('studentModal')">取消</button>
      <button class="btn btn-primary" onclick="saveStudent()">💾 保存</button>
    </div>
  </div>
</div>

<!-- ===== Sign-in (销课) Modal ===== -->
<div class="modal-overlay" id="signinModal">
  <div class="modal">
    <div class="modal-header">
      <h2>✍️ 签到销课</h2>
      <button class="modal-close" onclick="closeModal('signinModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="signin-student-info">
        <div class="name" id="signinStudentName">—</div>
        <div class="meta">
          剩余课时：<strong id="signinRemainHours">0</strong> &nbsp;|&nbsp;
          班级：<span id="signinStudentClass">—</span>
        </div>
      </div>
      <div class="signin-hint">
        ⚠️ 签到后将自动扣除 1 个课时
      </div>
      <div class="form-group">
        <label>📚 课程类别</label>
        <select id="signinCourseSelect">
          <option value="">请选择课程</option>
        </select>
      </div>
      <div class="form-group">
        <label>📝 备注（可选）</label>
        <input type="text" id="signinNote" placeholder="例如：第3节课，表现优秀" autocomplete="off">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('signinModal')">取消</button>
      <button class="btn btn-success" onclick="confirmSignin()">✅ 确认签到（-1课时）</button>
    </div>
  </div>
</div>

<!-- ===== Batch Sign-in Modal ===== -->
<div class="modal-overlay" id="batchSigninModal">
  <div class="modal" style="max-width: 600px;">
    <div class="modal-header">
      <h2>🚀 一键签到（按班级）</h2>
      <button class="modal-close" onclick="closeModal('batchSigninModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>🏫 选择班级</label>
          <select id="batchClassSelect" onchange="renderBatchStudentList()">
            <option value="">请选择班级</option>
          </select>
        </div>
        <div class="form-group">
          <label>📚 课程类别 *</label>
          <select id="batchCourseSelect" onchange="renderBatchStudentList()">
            <option value="">请选择课程</option>
            <option value="常规课">常规课</option>
            <option value="集训课">集训课</option>
          </select>
        </div>
      </div>
      <div class="signin-hint">
        💡 默认全员签到，取消勾选 = 请假（不扣课时）。课时为 0 的学员自动跳过。
      </div>
      <div id="batchStudentList" style="max-height: 300px; overflow-y: auto;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('batchSigninModal')">取消</button>
      <button class="btn btn-success" onclick="confirmBatchSignin()">✅ 确认签到</button>
    </div>
  </div>
</div>

<!-- ===== Student Profile Modal ===== -->
<div class="modal-overlay" id="profileModal">
  <div class="modal" style="max-width: 520px;">
    <div class="modal-header">
      <h2>📋 学生档案</h2>

<!-- ===== Toast Container ===== -->
<div class="toast-container" id="toastContainer"></div>

<script type="application/json" id="embedded-data"></script>
<script>
// ==================== 数据存储 ====================
// Template uses test keys — exported files use production keys to avoid conflict
const STORAGE_KEYS = {
  students: 'teacher_app_test_students',
  history: 'teacher_app_test_history',
};

const DEFAULT_COURSES = ['常规课', '集训课'];

function loadData(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}

function saveData(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

// Load data: localStorage first, fall back to embedded data in file
let students = loadData(STORAGE_KEYS.students, null);
let history = loadData(STORAGE_KEYS.history, null);

// If localStorage has no data, seed from embedded data block
if ((!students || students.length === 0) || (!history || history.length === 0)) {
  const el = document.getElementById('embedded-data');
  if (el && el.textContent.trim()) {
    try {
      const data = JSON.parse(el.textContent);
      if (data.students && data.students.length > 0) {
        students = data.students;
        history = data.history || [];
        persistStudents();
        persistHistory();
      }
    } catch (e) {}
  }
}
// Final fallback
if (!students) students = [];
if (!history) history = [];

// Migration: convert old {course, hours} to new {courses:[], studentNo}
function migrateStudents() {
  let changed = false;
  students.forEach(s => {
    if (!s.studentNo) {
      s.studentNo = generateStudentNo(s.createdAt || new Date().toISOString());
      changed = true;
    }
    if (!s.courses) {
      // Migrate old single-course format
      s.courses = [];
      if (s.course && s.hours > 0) {
        s.courses.push({ type: s.course, hours: s.hours });
      }
      delete s.course;
      delete s.hours;
      changed = true;
    }
  });
  if (changed) persistStudents();
}
migrateStudents();

// Generate student number: YYMMDD-NN based on creation date
function generateStudentNo(createdAt) {
  const d = new Date(createdAt);
  const yymmdd = String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  // Count existing students with same date prefix
  const prefix = yymmdd;
  const count = students.filter(s => s.studentNo && s.studentNo.startsWith(prefix)).length;
  return prefix + '-' + String(count + 1).padStart(2, '0');
}

// Courses are fixed — no longer persisted
let courseList = DEFAULT_COURSES;

// Classes are derived dynamically from students — no longer stored separately
function getClassList() {
  const classes = new Set(students.map(s => s.className).filter(Boolean));
  return [...classes].sort();
}

// Persist helpers
function persistStudents() { saveData(STORAGE_KEYS.students, students); }
function persistHistory() { saveData(STORAGE_KEYS.history, history); }

// ==================== Toast ====================
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  toast.innerHTML = `${icons[type] || ''} ${msg}`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity .3s'; setTimeout(() => toast.remove(), 300); }, 2500);
}

// ==================== Modal helpers ====================
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

// ==================== Tab Switch ====================
function switchTab(tab) {
  const tabs = document.querySelectorAll('.tab-btn');
  tabs.forEach(b => b.classList.remove('active'));
  const tbStudents = document.getElementById('toolbarStudents');
  const tbHistory = document.getElementById('toolbarHistory');
  const twStudents = document.getElementById('studentsTableWrapper');
  const twHistory = document.getElementById('historyTableWrapper');
  const twArchive = document.getElementById('archiveTableWrapper');
  [tbStudents, tbHistory].forEach(e => e.style.display = 'none');
  [twStudents, twHistory, twArchive].forEach(e => e.style.display = 'none');

  if (tab === 'students') {
    tabs[0].classList.add('active');
    tbStudents.style.display = 'flex';
    document.getElementById('historySubTabs').style.display = 'none';
    document.getElementById('archiveSubTabs').style.display = 'none';
    twStudents.style.display = '';
  } else if (tab === 'history') {
    document.getElementById('archiveSubTabs').style.display = 'none';
    tabs[1].classList.add('active');
    tbHistory.style.display = 'flex';
    document.getElementById('historySubTabs').style.display = 'flex';
    twHistory.style.display = '';
    historyView = 'active';
    buildArchiveTabs();
    renderHistory();
  } else {
    tabs[2].classList.add('active');
    document.getElementById('historySubTabs').style.display = 'none';
    document.getElementById('archiveSubTabs').style.display = 'flex';
    twArchive.style.display = '';
    archiveView = 'active';
    buildArchivePageTabs();
    renderArchive();
  }
}

// ==================== Populate Dropdowns ====================
function populateFilters() {
  const classes = getClassList();

  // Class filter for students
  const filterClass = document.getElementById('filterClass');
  filterClass.innerHTML = '<option value="">📂 全部班级</option>' + classes.map(c => `<option value="${c}">${c}</option>`).join('');

  // Course filter
  const filterCourse = document.getElementById('filterCourse');
  filterCourse.innerHTML = '<option value="">📖 全部课程类别</option>' + courseList.map(c => `<option value="${c}">${c}</option>`).join('');

  // History class filter
  const filterHistoryClass = document.getElementById('filterHistoryClass');
  filterHistoryClass.innerHTML = '<option value="">📂 全部班级</option>' + classes.map(c => `<option value="${c}">${c}</option>`).join('');

  // Class datalist for autocomplete
  const datalist = document.getElementById('classDatalist');
  datalist.innerHTML = classes.map(c => `<option value="${c}">`).join('');
}

// ==================== Render Student Table ====================
function renderStudents() {
  const wrapper = document.getElementById('studentsTableWrapper');
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const filterClass = document.getElementById('filterClass').value;
  const filterCourse = document.getElementById('filterCourse').value;

  let filtered = students.filter(s => {
    const courseNames = (s.courses || []).map(c => c.type);
    const matchSearch = !search || s.name.toLowerCase().includes(search) || (s.phone || '').includes(search) || (s.studentNo || '').includes(search) || s.className.toLowerCase().includes(search) || courseNames.join(' ').includes(search);
    const matchClass = !filterClass || s.className === filterClass;
    const matchCourse = !filterCourse || courseNames.includes(filterCourse);
    return matchSearch && matchClass && matchCourse;
  });

  if (filtered.length === 0) {
    wrapper.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><p>${students.length === 0 ? '还没有添加学员' : '没有匹配的学员'}</p>${students.length === 0 ? '<button class="btn btn-primary" style="margin-top:12px" onclick="openAddStudentModal()">＋ 添加第一个学员</button>' : ''}</div>`;
  } else {
    wrapper.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>编号</th><th>姓名</th><th>电话</th><th>课程</th><th>班级</th><th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(s => {
            const totalHours = (s.courses || []).reduce((sum, c) => sum + c.hours, 0);
            return `
              <tr>
                <td style="color:var(--text-muted);font-size:.8rem">${escHtml(s.studentNo || '')}</td>
                <td>
                <strong>${escHtml(s.name)}</strong>
                ${s.note ? `<div style="font-size:.78rem;color:var(--text-muted);margin-top:2px">${escHtml(s.note)}</div>` : ''}
              </td>
                <td>${escHtml(s.phone) || '—'}</td>
                <td>
                  ${(s.courses || []).map(c => `<span class="badge ${c.type === '常规课' ? 'badge-blue' : 'badge-orange'}">${escHtml(c.type)} ${c.hours}课时</span>`).join(' ') || '<span style="color:var(--text-muted)">—</span>'}
                </td>
                <td><span class="badge badge-green">${escHtml(s.className)}</span></td>
                <td>
                  <div class="action-btns">
                    <button class="btn btn-success btn-sm" onclick="openSigninModal('${s.id}')" ${totalHours <= 0 ? 'disabled' : ''}>✍️ 签到</button>
                    <button class="btn btn-outline btn-sm" onclick="openEditStudentModal('${s.id}')">✏️ 编辑</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.id}')">🗑️ 删除</button>
                  </div>
                </td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  updateStats();
}

// ==================== Render History Table ====================
function renderHistory() {
  const wrapper = document.getElementById('historyTableWrapper');
  const search = document.getElementById('searchHistory').value.toLowerCase().trim();
  const filterClass = document.getElementById('filterHistoryClass').value;

  // --- Archived view (specific archive name) ---
  if (historyView !== 'active') {
    const archivedRecords = history.filter(h => h.archiveName === historyView);
    if (archivedRecords.length === 0) {
      wrapper.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div><p>该归档下暂无记录</p></div>';
      return;
    }

    // Group by studentId + archiveName
    const grouped = {};
    archivedRecords.forEach(h => {
      const key = h.studentId + '|' + h.archiveName;
      if (!grouped[key]) {
        grouped[key] = { studentName: h.studentName, className: h.className, archiveName: h.archiveName, records: [] };
      }
      grouped[key].records.push(h);
    });

    // Flatten and sort: newest last-sign-in first
    let list = Object.values(grouped).sort((a, b) => {
      const bMax = Math.max(...b.records.map(r => new Date(r.time).getTime()));
      const aMax = Math.max(...a.records.map(r => new Date(r.time).getTime()));
      return bMax - aMax;
    });

    // Search/filter
    if (search) list = list.filter(g => g.studentName.toLowerCase().includes(search));
    if (filterClass) list = list.filter(g => g.className === filterClass);

    if (list.length === 0) {
      wrapper.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div><p>没有匹配的归档记录</p></div>';
      return;
    }

    // Sort records within each group: newest first
    list.forEach(g => g.records.sort((a, b) => new Date(b.time) - new Date(a.time)));

    wrapper.innerHTML = list.map(g => {
      const courses = [...new Set(g.records.map(r => r.course))];
      const times = g.records.map(r => r.time).sort();
      return `
      <div class="history-student-card open" style="margin-bottom:8px">
        <div class="history-card-header" onclick="toggleHistoryCard(this)">
          <div class="history-card-info">
            <strong>${escHtml(g.studentName)}</strong>
            <span class="badge badge-green">${escHtml(g.className)}</span>
            <span style="font-size:.75rem;color:var(--text-muted)">📦 ${escHtml(g.archiveName)}</span>
          </div>
          <div class="history-card-meta">
            <span>${g.records.length} 次 · ${formatDate(times[0])} ~ ${formatDate(times[times.length-1])}</span>
            <span class="collapse-arrow">▼</span>
          </div>
        </div>
        <div class="history-card-body">
          <table>
            <thead><tr><th>时间</th><th>课程</th><th>剩余</th><th>备注</th><th style="width:40px"></th></tr></thead>
            <tbody>
              ${g.records.map(r => `
                <tr>
                  <td>${formatDateTime(r.time)}</td>
                  <td><span class="badge ${r.course === '常规课' ? 'badge-blue' : 'badge-orange'}">${escHtml(r.course)}</span></td>
                  <td>${r.remainHours} 课时</td>
                  <td>${escHtml(r.note) || '—'}</td>
                  <td><button class="btn btn-danger btn-xs" onclick="deleteHistoryRecord('${r.id}')">✕</button></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `}).join('');
    return;
  }

  // --- Active view ---
  // Group by studentId
  const grouped = {};
  history.forEach(h => {
    if (!grouped[h.studentId]) {
      grouped[h.studentId] = {
        studentId: h.studentId,
        studentName: h.studentName,
        className: h.className,
        course: h.course,
        records: [],
      };
    }
    grouped[h.studentId].records.push(h);
  });

  // Filter
  let groups = Object.values(grouped);
  if (search) {
    groups = groups.filter(g => g.studentName.toLowerCase().includes(search));
  }
  if (filterClass) {
    groups = groups.filter(g => g.className === filterClass);
  }

  // Sort groups: most recently active first
  groups.sort((a, b) => {
    const aMax = Math.max(...a.records.map(r => new Date(r.time).getTime()));
    const bMax = Math.max(...b.records.map(r => new Date(r.time).getTime()));
    return bMax - aMax;
  });

  // Sort records within each group: newest first
  groups.forEach(g => g.records.sort((a, b) => new Date(b.time) - new Date(a.time)));

  if (groups.length === 0) {
    wrapper.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>暂无签到记录</p></div>';
  } else {
    // Active view: only show non-archived records
    const activeGroups = groups.map(g => ({
      ...g,
      records: g.records.filter(r => !r.archiveName)
    })).filter(g => g.records.length > 0);

    if (activeGroups.length === 0) {
      wrapper.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><p>当前无进行中记录</p></div>';
      return;
    }

    wrapper.innerHTML = activeGroups.map(g => `
      <div class="history-student-card open">
        <div class="history-card-header" onclick="toggleHistoryCard(this)">
          <div class="history-card-info">
            <strong>${escHtml(g.studentName)}</strong>
            <span class="badge badge-green">${escHtml(g.className)}</span>
          </div>
          <div class="history-card-meta">
            <span>${g.records.length} 次签到</span>
            <span class="collapse-arrow">▼</span>
          </div>
        </div>
        <div class="history-card-body">
          <table>
            <thead><tr><th>签到时间</th><th>剩余课时</th><th>备注</th><th style="width:40px"></th></tr></thead>
            <tbody>
              ${g.records.map(r => `
                <tr>
                  <td>${formatDateTime(r.time)}</td>
                  <td>${r.remainHours} 课时</td>
                  <td>${escHtml(r.note) || '—'}</td>
                  <td><button class="btn btn-danger btn-xs" onclick="deleteHistoryRecord('${r.id}')">✕</button></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `).join('');
  }
}

function toggleHistoryCard(header) {
  header.parentElement.classList.toggle('open');
}

// ==================== Archive Tab ====================
function buildArchivePageTabs() {
  const container = document.getElementById('archiveSubTabs');
  const archiveNames = [...new Set(history.filter(h => h.archiveName).map(h => h.archiveName))].sort();

  if (archiveView !== 'active' && !archiveNames.includes(archiveView)) {
    archiveView = 'active';
  }

  let html = `<button class="archive-sub-tab ${archiveView === 'active' ? 'active' : ''}" onclick="switchArchiveView('active')" style="padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:${archiveView==='active'?'var(--primary)':'var(--surface)'};font-size:.78rem;font-weight:600;cursor:pointer;color:${archiveView==='active'?'#fff':'var(--text-muted)'};white-space:nowrap">📝 当前</button>`;

  archiveNames.forEach(name => {
    const sids = [...new Set(history.filter(h => h.archiveName === name).map(h => h.studentId))];
    const count = sids.length;
    html += `<button class="archive-sub-tab ${archiveView === name ? 'active' : ''}" onclick="switchArchiveView('${name.replace(/'/g, "\\'")}')" style="padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:${archiveView===name?'var(--primary)':'var(--surface)'};font-size:.78rem;font-weight:600;cursor:pointer;color:${archiveView===name?'#fff':'var(--text-muted)'};white-space:nowrap">📦 ${escHtml(name)} · ${count}人</button>`;
  });

  container.innerHTML = html;
}

function switchArchiveView(view) {
  archiveView = view;
  buildArchivePageTabs();
  renderArchive();
}

function renderArchive() {
  const wrapper = document.getElementById('archiveTableWrapper');

  // Archived view: show students from a specific archive
  if (archiveView !== 'active') {
    const records = history.filter(h => h.archiveName === archiveView);
    const studentMap = {};
    records.forEach(r => {
      if (!studentMap[r.studentId]) {
        studentMap[r.studentId] = { name: r.studentName, className: r.className, courses: new Set(), records: [] };
      }
      studentMap[r.studentId].courses.add(r.course);
      studentMap[r.studentId].records.push(r);
    });

    const list = Object.values(studentMap).sort((a, b) => b.records.length - a.records.length);

    if (list.length === 0) {
      wrapper.innerHTML = '<div class="empty-state"><div class="empty-icon">📂</div><p>该归档下暂无学员</p></div>';
      return;
    }

    wrapper.innerHTML = list.map(s => {
      const courses = [...s.courses];
      const times = s.records.map(r => r.time).sort();
      return `
      <div class="history-student-card" style="margin-bottom:8px">
        <div class="history-card-header" style="cursor:default">
          <div class="history-card-info">
            <strong>${escHtml(s.name)}</strong>
            <span class="badge badge-green">${escHtml(s.className)}</span>
            ${courses.map(c => `<span class="badge ${c === '常规课' ? 'badge-blue' : 'badge-orange'}">${escHtml(c)}</span>`).join(' ')}
          </div>
          <div class="history-card-meta">${s.records.length} 次签到 · ${formatDate(times[0])} ~ ${formatDate(times[times.length-1])}</div>
        </div>
      </div>
    `}).join('');
    return;
  }

  // Active view: show all current students
  if (students.length === 0) {
    wrapper.innerHTML = '<div class="empty-state"><div class="empty-icon">📂</div><p>暂无学员</p></div>';
    return;
  }

  const list = [...students].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  wrapper.innerHTML = list.map(s => `
    <div class="history-student-card" style="margin-bottom:8px">
      <div class="history-card-header" style="cursor:default">
        <div class="history-card-info">
          <span style="color:var(--text-muted);font-size:.75rem">${escHtml(s.studentNo || '')}</span>
          <strong>${escHtml(s.name)}</strong>
          <span class="badge badge-green">${escHtml(s.className)}</span>
          ${(s.courses || []).map(c => `<span class="badge ${c.type === '常规课' ? 'badge-blue' : 'badge-orange'}">${escHtml(c.type)} ${c.hours}课时</span>`).join(' ')}
        </div>
        <div class="history-card-meta">${formatDate(s.createdAt)}</div>
      </div>
    </div>
  `).join('');
}

// ==================== Stats ====================
function updateStats() {
  document.getElementById('statTotal').textContent = students.length;
  const classes = new Set(students.map(s => s.className).filter(Boolean));
  document.getElementById('statClasses').textContent = classes.size;
}

// ==================== Student CRUD ====================
function openAddStudentModal() {
  document.getElementById('studentModalTitle').textContent = '添加学员';
  document.getElementById('editStudentId').value = '';
  document.getElementById('studentName').value = '';
  document.getElementById('studentPhone').value = '';
  document.getElementById('studentNormalHours').value = '0';
  document.getElementById('studentTrainingHours').value = '0';
  document.getElementById('studentClass').value = '';
  document.getElementById('studentNote').value = '';
  populateFilters();
  openModal('studentModal');
}

function openEditStudentModal(id) {
  const s = students.find(st => st.id === id);
  if (!s) return;
  document.getElementById('studentModalTitle').textContent = '编辑学员';
  document.getElementById('editStudentId').value = s.id;
  document.getElementById('studentName').value = s.name;
  document.getElementById('studentPhone').value = s.phone || '';
  const normal = s.courses.find(c => c.type === '常规课');
  const training = s.courses.find(c => c.type === '集训课');
  document.getElementById('studentNormalHours').value = normal ? normal.hours : '0';
  document.getElementById('studentTrainingHours').value = training ? training.hours : '0';
  document.getElementById('studentClass').value = s.className;
  document.getElementById('studentNote').value = s.note || '';
  populateFilters();
  openModal('studentModal');
}

function saveStudent() {
  const editId = document.getElementById('editStudentId').value;
  const name = document.getElementById('studentName').value.trim();
  const phone = document.getElementById('studentPhone').value.trim();
  const className = document.getElementById('studentClass').value;
  const normalHours = parseInt(document.getElementById('studentNormalHours').value) || 0;
  const trainingHours = parseInt(document.getElementById('studentTrainingHours').value) || 0;
  const note = document.getElementById('studentNote').value.trim();

  if (!name) { showToast('请输入学员姓名', 'error'); return; }
  if (!className) { showToast('请输入班级名称', 'error'); return; }
  if (normalHours <= 0 && trainingHours <= 0) { showToast('请至少填写一门课的课时', 'error'); return; }

  const courses = [];
  if (normalHours > 0) courses.push({ type: '常规课', hours: normalHours });
  if (trainingHours > 0) courses.push({ type: '集训课', hours: trainingHours });

  if (editId) {
    const idx = students.findIndex(s => s.id === editId);
    if (idx !== -1) {
      students[idx].name = name;
      students[idx].phone = phone;
      students[idx].className = className;
      students[idx].courses = courses;
      students[idx].note = note;
      showToast('学员信息已更新 ✅', 'success');
    }
  } else {
    const createdAt = new Date().toISOString();
    const newStudent = {
      id: generateId(),
      studentNo: generateStudentNo(createdAt),
      name,
      phone,
      className,
      courses,
      note,
      createdAt,
    };
    students.push(newStudent);
    showToast('学员添加成功 🎉', 'success');
  }

  persistStudents();
  closeModal('studentModal');
  renderStudents();
  populateFilters();
}

function deleteStudent(id) {
  const s = students.find(st => st.id === id);
  if (!s) return;
  if (!confirm(`确定要删除学员「${s.name}」吗？\n此操作不可恢复！`)) return;

  students = students.filter(st => st.id !== id);
  persistStudents();
  renderStudents();
  renderHistory();
  populateFilters();
  showToast(`已删除学员「${s.name}」`, 'info');
}

// ==================== Sign-in ====================
let signinTargetId = null;
let historyView = 'active'; // 'active' or archive name
let archiveView = 'active'; // 'active' or archive name

function buildArchiveTabs() {
  const container = document.getElementById('historySubTabs');
  const archiveNames = [...new Set(history.filter(h => h.archiveName).map(h => h.archiveName))].sort();

  // Keep current selection if still valid
  if (historyView !== 'active' && !archiveNames.includes(historyView)) {
    historyView = 'active';
  }

  let html = `<button class="history-sub-tab ${historyView === 'active' ? 'active' : ''}" onclick="switchHistoryView('active')" style="padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:.78rem;font-weight:600;cursor:pointer;color:var(--text-muted);white-space:nowrap">📝 当前</button>`;

  archiveNames.forEach(name => {
    const count = history.filter(h => h.archiveName === name).length;
    const active = historyView === name;
    html += `<button class="history-sub-tab ${active ? 'active' : ''}" onclick="switchHistoryView('${name.replace(/'/g, "\\'")}')" style="padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:${active ? 'var(--primary)' : 'var(--surface)'};font-size:.78rem;font-weight:600;cursor:pointer;color:${active ? '#fff' : 'var(--text-muted)'};white-space:nowrap">📦 ${escHtml(name)} · ${count}</button>`;
  });

  container.innerHTML = html;
}

function switchHistoryView(view) {
  historyView = view;
  buildArchiveTabs();
  renderHistory();
}

function openSigninModal(id) {
  const s = students.find(st => st.id === id);
  if (!s) return;

  // Courses with remaining hours
  const availableCourses = (s.courses || []).filter(c => c.hours > 0);
  if (availableCourses.length === 0) { showToast('该学员课时已用完，无法签到', 'error'); return; }

  signinTargetId = id;
  document.getElementById('signinStudentName').textContent = s.name;
  document.getElementById('signinStudentClass').textContent = s.className;
  document.getElementById('signinNote').value = '';

  const select = document.getElementById('signinCourseSelect');
  if (availableCourses.length === 1) {
    select.innerHTML = `<option value="${availableCourses[0].type}">${availableCourses[0].type}（剩余 ${availableCourses[0].hours}）</option>`;
    select.disabled = true;
  } else {
    select.innerHTML = '<option value="">请选择课程</option>' + availableCourses.map(c => `<option value="${c.type}">${c.type}（剩余 ${c.hours}）</option>`).join('');
    select.disabled = false;
  }
  document.getElementById('signinRemainHours').textContent = availableCourses.map(c => `${c.type}${c.hours}`).join(' / ');
  openModal('signinModal');
}

function confirmSignin() {
  if (!signinTargetId) return;
  const s = students.find(st => st.id === signinTargetId);
  if (!s) return;

  const courseType = document.getElementById('signinCourseSelect').value;
  if (!courseType) { showToast('请选择课程', 'error'); return; }

  const course = (s.courses || []).find(c => c.type === courseType);
  if (!course || course.hours <= 0) { showToast('课时不足，无法签到', 'error'); return; }

  course.hours -= 1;
  const note = document.getElementById('signinNote').value.trim();
  const record = {
    id: generateId(),
    studentId: s.id,
    studentName: s.name,
    className: s.className,
    course: courseType,
    time: new Date().toISOString(),
    remainHours: course.hours,
    note,
  };
  history.push(record);

  persistStudents();
  persistHistory();
  closeModal('signinModal');
  signinTargetId = null;
  renderStudents();
  renderHistory();
  showToast(`签到成功！「${s.name}」${courseType} 剩余 ${course.hours} 课时 ✍️`, 'success');
}

// ==================== Student Profile ====================
function openProfile(studentId) {
  const s = students.find(st => st.id === studentId);
  if (!s) return;
  document.getElementById('profileName').textContent = s.name;
  document.getElementById('profileClass').textContent = s.className;
  document.getElementById('profilePhone').textContent = s.phone || '未填写';

  // Build course history from sign-in records
  const records = history.filter(h => h.studentId === studentId);
  const courseMap = {};
  records.forEach(r => {
    const key = r.course + '|' + (r.archiveName || '进行中');
    if (!courseMap[key]) courseMap[key] = { course: r.course, archiveName: r.archiveName || '进行中', count: 0, first: r.time, last: r.time };
    courseMap[key].count++;
    if (r.time < courseMap[key].first) courseMap[key].first = r.time;
    if (r.time > courseMap[key].last) courseMap[key].last = r.time;
  });

  const entries = Object.values(courseMap).sort((a, b) => b.last.localeCompare(a.last));
  const container = document.getElementById('profileHistory');
  if (entries.length === 0) {
    container.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">暂无签到记录</p>';
  } else {
    container.innerHTML = `
      <table>
        <thead><tr><th>课程</th><th>归档</th><th>次数</th><th>时间范围</th></tr></thead>
        <tbody>
          ${entries.map(e => `
            <tr>
              <td><span class="badge ${e.course === '常规课' ? 'badge-blue' : 'badge-orange'}">${escHtml(e.course)}</span></td>
              <td>${escHtml(e.archiveName)}</td>
              <td>${e.count} 次</td>
              <td>${formatDate(e.first)} ~ ${formatDate(e.last)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }
  openModal('profileModal');
}

// ==================== Archive (结课) ====================
function openArchiveModal() {
  document.getElementById('archiveCourseSelect').value = '';
  document.getElementById('archiveName').value = '';
  document.getElementById('archiveCount').textContent = '';
  openModal('archiveModal');

  // Show live count
  document.getElementById('archiveCourseSelect').onchange = updateArchiveCount;
  updateArchiveCount();
}

function updateArchiveCount() {
  const course = document.getElementById('archiveCourseSelect').value;
  let count;
  if (course) {
    count = history.filter(h => h.course === course && !h.archiveName).length;
  } else {
    count = history.filter(h => !h.archiveName).length;
  }
  document.getElementById('archiveCount').textContent = `当前进行中记录：${count} 条${course ? '（' + course + '）' : ''}`;
}

function confirmArchive() {
  const course = document.getElementById('archiveCourseSelect').value;
  const name = document.getElementById('archiveName').value.trim();
  if (!name) { showToast('请输入归档名称', 'error'); return; }

  let count = 0;
  history.forEach(h => {
    if (!h.archiveName && (!course || h.course === course)) {
      h.archiveName = name;
      count++;
    }
  });

  if (count === 0) { showToast('没有可归档的记录', 'error'); return; }

  persistHistory();
  closeModal('archiveModal');
  renderHistory();
  showToast(`已归档 ${count} 条记录 → "${name}"`, 'success');
}

// ==================== Batch Sign-in ====================
function openBatchSigninModal() {
  // Populate class dropdown
  const select = document.getElementById('batchClassSelect');
  const classes = getClassList();
  select.innerHTML = '<option value="">请选择班级</option>' + classes.map(c => `<option value="${c}">${c}</option>`).join('');
  document.getElementById('batchStudentList').innerHTML = '';
  openModal('batchSigninModal');
}

function renderBatchStudentList() {
  const className = document.getElementById('batchClassSelect').value;
  const courseFilter = document.getElementById('batchCourseSelect').value;
  const container = document.getElementById('batchStudentList');

  if (!className) {
    container.innerHTML = '';
    return;
  }
  if (!courseFilter) {
    container.innerHTML = '<div class="empty-state" style="padding:20px"><p>请选择课程类别</p></div>';
    return;
  }

  let classStudents = students.filter(s => s.className === className && (s.courses || []).some(c => c.type === courseFilter));

  if (classStudents.length === 0) {
    container.innerHTML = '<div class="empty-state" style="padding:30px"><p>该班级暂无学员</p></div>';
    return;
  }

  container.innerHTML = `
    <table>
      <thead>
        <tr><th style="width:40px">签到</th><th>姓名</th><th>课程</th><th>剩余课时</th><th>状态</th></tr>
      </thead>
      <tbody>
        ${classStudents.map(s => {
          // If a course filter is set, show only that course's hours
          const targetCourse = courseFilter ? (s.courses || []).find(c => c.type === courseFilter) : null;
          const hours = targetCourse ? targetCourse.hours : (s.courses || []).reduce((sum, c) => sum + c.hours, 0);
          const noHours = hours <= 0;
          return `
            <tr>
              <td>
                <input type="checkbox" class="batch-check" value="${s.id}" ${noHours ? 'disabled' : 'checked'} style="width:18px;height:18px;cursor:pointer">
              </td>
              <td><strong>${escHtml(s.name)}</strong></td>
              <td>${targetCourse ? `<span class="badge ${targetCourse.type === '常规课' ? 'badge-blue' : 'badge-orange'}">${escHtml(targetCourse.type)}</span>` : (s.courses || []).map(c => `<span class="badge ${c.type === '常规课' ? 'badge-blue' : 'badge-orange'}">${escHtml(c.type)}</span>`).join(' ')}</td>
              <td class="${hours <= 2 ? 'hours-low' : 'hours-ok'}"><strong>${hours}</strong></td>
              <td>${noHours ? '<span class="badge badge-orange">😴 课时不足</span>' : '<span class="badge badge-green">✅ 可签到</span>'}</td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline btn-sm" onclick="document.querySelectorAll('.batch-check:not([disabled])').forEach(c=>c.checked=true)">全选</button>
      <button class="btn btn-outline btn-sm" onclick="document.querySelectorAll('.batch-check:not([disabled])').forEach(c=>c.checked=false)">取消全选</button>
    </div>`;
}

function confirmBatchSignin() {
  const className = document.getElementById('batchClassSelect').value;
  const courseFilter = document.getElementById('batchCourseSelect').value;
  if (!className) { showToast('请选择班级', 'error'); return; }
  if (!courseFilter) { showToast('请选择课程类别', 'error'); return; }

  const checkboxes = document.querySelectorAll('.batch-check:checked');
  if (checkboxes.length === 0) { showToast('没有可签到的学员', 'error'); return; }

  let signedCount = 0;
  let absentCount = 0;

  checkboxes.forEach(cb => {
    const s = students.find(st => st.id === cb.value);
    if (!s) return;

    const course = (s.courses || []).find(c => c.type === courseFilter);
    if (!course || course.hours <= 0) return;

    course.hours -= 1;
    signedCount++;

    history.push({
      id: generateId(),
      studentId: s.id,
      studentName: s.name,
      className: s.className,
      course: courseFilter,
      time: new Date().toISOString(),
      remainHours: course.hours,
      note: '',
    });
  });

  // Count absent students (unchecked, who had hours)
  const allChecks = document.querySelectorAll('.batch-check:not([disabled])');
  absentCount = allChecks.length - checkboxes.length;

  persistStudents();
  persistHistory();
  closeModal('batchSigninModal');
  renderStudents();
  renderHistory();

  let msg = `批量签到完成！签到 ${signedCount} 人`;
  if (absentCount > 0) msg += `，请假 ${absentCount} 人`;
  showToast(msg, 'success');
}

// ==================== History ====================
function clearHistory() {
  if (!confirm('确定要清空所有签到记录吗？此操作不可恢复！')) return;
  history = [];
  persistHistory();
  renderHistory();
  showToast('签到记录已清空', 'info');
}

function deleteHistoryRecord(id) {
  const idx = history.findIndex(h => h.id === id);
  if (idx === -1) return;
  if (!confirm('确定要删除这条签到记录吗？')) return;
  history.splice(idx, 1);
  persistHistory();
  renderHistory();
  showToast('签到记录已删除', 'info');
}

// ==================== Utilities ====================
function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDateTime(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== Reset ====================
function resetApp() {
  const pw = prompt('⚠️ 此操作将清除所有修改，恢复为初始数据！\n\n请输入重置密码确认操作：');
  if (pw === null) return;
  if (pw !== RESET_PASSWORD) { showToast('重置密码错误 ❌', 'error'); return; }
  localStorage.removeItem(STORAGE_KEYS.students);
  localStorage.removeItem(STORAGE_KEYS.history);
  sessionStorage.removeItem('teacher_app_unlocked');
  location.reload();
}

// ==================== Export / Import ====================
function exportData() {
  const data = { students, history, exportedAt: new Date().toISOString() };
  const json = JSON.stringify(data);

  // Ensure password overlay is active in exported file
  const pwOverlay = document.getElementById('passwordOverlay');
  const wasActive = pwOverlay && pwOverlay.classList.contains('active');
  if (pwOverlay && !wasActive) pwOverlay.classList.add('active');

  let html = document.documentElement.outerHTML;

  // Restore original state
  if (pwOverlay && !wasActive) pwOverlay.classList.remove('active');

  // Replace the embedded-data script content with new data
  html = html.replace(
    /(<script type="application\/json" id="embedded-data">)[\s\S]*?(<\/script>)/,
    '$1' + json + '$2'
  );
  // Swap test storage keys for production keys in the exported file
  html = html.replace(/teacher_app_test_students/g, 'teacher_app_students');
  html = html.replace(/teacher_app_test_history/g, 'teacher_app_history');

  const blob = new Blob(['<!DOCTYPE html>\n', html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `学员管理系统_${new Date().toISOString().slice(0, 10)}.html`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出为完整文件，打开即用 ✅', 'success');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.students || !Array.isArray(data.students)) {
        throw new Error('数据格式不正确');
      }

      const action = confirm(
        `即将导入：\n• ${data.students.length} 名学员\n• ${(data.history || []).length} 条签到记录\n\n点击"确定"覆盖当前数据\n点击"取消"放弃导入`
      );

      if (!action) return;

      students = data.students;
      history = data.history || [];
      persistStudents();
      persistHistory();
      populateFilters();
      renderStudents();
      renderHistory();
      updateStats();
      showToast(`导入成功！${students.length} 名学员已恢复 🎉`, 'success');
    } catch (err) {
      showToast('导入失败：文件格式不正确 ❌', 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ==================== Password ====================
const APP_PASSWORD = '0705';
const RESET_PASSWORD = '1111';

function checkPassword() {
  const input = document.getElementById('passwordInput');
  const errorEl = document.getElementById('passwordError');
  if (input.value === APP_PASSWORD) {
    sessionStorage.setItem('teacher_app_unlocked', '1');
    document.getElementById('passwordOverlay').classList.remove('active');
    input.value = '';
    errorEl.style.display = 'none';
  } else {
    errorEl.style.display = 'block';
    input.value = '';
    input.focus();
  }
}

// Enter key on password input
document.addEventListener('DOMContentLoaded', function() {
  const pwInput = document.getElementById('passwordInput');
  if (pwInput) {
    pwInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
  }
});

// ==================== Init ====================
function init() {
  // Check if already unlocked this session
  if (sessionStorage.getItem('teacher_app_unlocked') === '1') {
    document.getElementById('passwordOverlay').classList.remove('active');
  }
  populateFilters();
  renderStudents();
  updateStats();
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
  });
});

// Keyboard shortcut: Escape to close all modals
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active').forEach(o => o.classList.remove('active'));
  }
});

init();
